# Prefix stays default (C-b). Pane splits stay default (%, "). Pane
# navigation stays default (arrow keys) — vim-style keys are scoped to
# copy-mode only, by choice.

set-window-option -g mode-keys vi

# `y` mirrors vim's yank key — same action tmux binds to Enter by default.
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Let copy-mode yanks reach the real terminal clipboard via OSC 52. Works
# the same whether this session is local or remote, no xclip/wl-copy needed.
set -g set-clipboard on

set -g mouse on

# --- Statusline: hand-rolled, Dracula palette, no plugin ---
# bg #282a36  current-line #44475a  fg #f8f8f2  comment #6272a4
# purple #bd93f9  pink #ff79c6  green #50fa7b

set -g status-style "bg=#282a36,fg=#f8f8f2"
set -g status-left-length 40
set -g status-left "#[bg=#bd93f9,fg=#282a36,bold] #S #[bg=#282a36,fg=#bd93f9,nobold]"
set -g status-right "#[fg=#6272a4]#[bg=#44475a,fg=#f8f8f2] %Y-%m-%d %H:%M "
set -g window-status-current-format "#[bg=#44475a,fg=#ff79c6,bold] #I:#W #[bg=#282a36]"
set -g window-status-format " #I:#W "
